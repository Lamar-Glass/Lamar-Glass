name: Refresh GitHub achievements

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official achievement badges
        run: python3 github-achievements/github_achievements.py --update-readme

      - name: Commit refreshed badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md github-achievements/assets
          if git diff --cached --quiet; then
            echo "No achievement changes to commit"
          else
            git commit -m "chore: refresh GitHub achievement badges"
            git push
          fi
